<title>EN-MATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: barra de rol arriba; debajo, barra lateral de navegación + contenido + columna derecha (en estudiante). En móvil todo se apila. */
:root{
  --bg:#FFFFFF; --mint-50:#F1FBF8; --mint-100:#E1F6EF; --mint-200:#BDEBDD; --line:#E0EFE9;
  --brand:#1FB597; --brand-600:#139A80; --brand-700:#0C7865; --brand-ink:#FFFFFF;
  --ink:#10302A; --muted:#5C7570;
  --sun:#FFB020; --sun-soft:#FFF3D6; --coral:#F0604D; --coral-soft:#FDE6E2; --sky:#2F7BEA; --sky-soft:#E3EEFD; --violet:#7458F2; --violet-soft:#EDE9FE; --good:#16A06A; --good-soft:#DDF5E9;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(16,48,42,.05),0 6px 20px -8px rgba(16,48,42,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- Barra de rol ---------- */
.rolebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rolebar-in{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.wordmark{font-family:var(--display);font-weight:800;line-height:.9;color:var(--brand);font-size:17px;position:relative;padding:4px 0 0 6px;isolation:isolate}
.wordmark::before{content:"";position:absolute;left:-4px;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--mint-100);z-index:-1}
.wordmark span{display:block}
.viewas{font-size:12px;font-weight:600;color:var(--muted);margin-left:auto}
.roles{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--mint-50);border:1px solid var(--line);border-radius:99px;max-width:100%}
.roles button{border:0;background:transparent;padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;transition:background .25s,color .25s}
.roles button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 12px -4px var(--brand)}
.present{border:1.5px solid var(--brand);background:#fff;color:var(--brand-700);padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.present.on{background:var(--brand-700);color:#fff;border-color:var(--brand-700)}
.pbar{height:3px;background:var(--brand);width:0}

/* ---------- Estructura ---------- */
.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;padding-block:18px 40px;padding-inline:20px}
.side{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500;transition:background .2s,transform .2s}
.nav a:hover{background:var(--mint-50);transform:translateX(3px)}
.nav a.on{background:var(--mint-100);font-weight:700;color:var(--brand-700)}
.nav svg{width:18px;height:18px;flex:none}
.sidecard{background:linear-gradient(160deg,var(--mint-100),var(--mint-50));border-radius:var(--r);padding:16px;overflow:hidden;position:relative}
.sidecard b{font-family:var(--display);font-size:14px;display:block;max-width:12ch}
.sidecard .steps{display:flex;align-items:flex-end;gap:6px;margin-top:12px;height:64px}
.sidecard .steps i{flex:1;background:var(--brand);border-radius:6px 6px 0 0;opacity:.35;transform-origin:bottom}
.sidecard .steps i:nth-child(2){opacity:.55}.sidecard .steps i:nth-child(3){opacity:.75}.sidecard .steps i:nth-child(4){opacity:1}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav a{white-space:nowrap}
  .sidecard{display:none}
}

/* Barra superior del contenido */
.topline{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--mint-50);border:1px solid var(--line);border-radius:99px;padding:9px 16px;color:var(--muted);min-width:0}
.search svg{width:16px;height:16px;flex:none}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);width:100%;min-width:0;outline:none}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.bell{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff;position:relative}
.bell svg{width:18px;height:18px}
.bell::after{content:"";position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-700));flex:none}
.me .who{font-weight:600;font-size:13px;line-height:1.2}
.me .who small{display:block;color:var(--muted);font-weight:500}

/* Rejillas */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media (max-width:1180px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:900px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card.tint{background:var(--mint-50)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:700}
.link{font-size:12.5px;font-weight:700;color:var(--brand-700);text-decoration:none;background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* Entrada animada */
@keyframes up{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(.1)}to{transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .view>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
  .view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}
  .sidecard .steps i{animation:grow 1s ease both}
  .lift{transition:transform .25s,box-shadow .25s}
  .lift:hover{transform:translateY(-4px);box-shadow:0 14px 30px -12px rgba(16,48,42,.25)}
}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(120deg,var(--mint-100) 0%,var(--mint-50) 55%,#E6FAF4 100%);padding:28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:center;border:1px solid var(--line)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding:22px}}
.hero h1{font-size:clamp(26px,3.2vw,38px);font-weight:800;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--muted);max-width:44ch;margin:10px 0 18px}
.blob{position:absolute;border-radius:50%;opacity:.6;pointer-events:none}
.b1{width:260px;height:260px;background:radial-gradient(circle,var(--mint-200),transparent 70%);right:-60px;top:-80px}
.b2{width:180px;height:180px;background:radial-gradient(circle,#CFF3FF,transparent 70%);left:30%;bottom:-90px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;transition:transform .2s,box-shadow .2s,background .2s}
.btn svg{width:15px;height:15px}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 18px -8px var(--brand)}
.btn.p:hover{background:var(--brand-600)}
.btn:disabled{opacity:.7;cursor:default;transform:none;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.block{width:100%;justify-content:center}

.hero-art{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.orbwrap{position:relative;display:grid;place-items:center;width:150px;height:150px;flex:none}
.orb{width:136px;height:136px;border-radius:50%;background:conic-gradient(from 200deg,var(--brand),#7FE3CD,var(--brand-700),var(--brand));display:grid;place-items:center;position:relative;box-shadow:0 20px 50px -20px var(--brand-700)}
.orb::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.orb .in{position:relative;text-align:center}
.orb .in b{font-family:var(--display);font-size:28px;color:var(--brand-700);display:block;line-height:1}
.orb .in small{font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.2;display:block;margin-top:2px}
.ring-dash{position:absolute;inset:-8px;border:2px dashed var(--mint-200);border-radius:50%}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,181,151,.35)}100%{box-shadow:0 0 0 18px rgba(31,181,151,0)}}
@media (prefers-reduced-motion:no-preference){.ring-dash{animation:spin 30s linear infinite}.float{animation:floaty 4s ease-in-out infinite}.orb{animation:pulse 2.4s ease-out infinite}}
.pills{display:flex;flex-direction:column;gap:9px;min-width:0}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 8px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;text-align:left}
.pill i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--mint-100);color:var(--brand-700);flex:none}
.pill svg{width:14px;height:14px}
.pill:nth-child(2){animation-delay:.6s!important;margin-left:14px}.pill:nth-child(3){animation-delay:1.2s!important;margin-left:14px}.pill:nth-child(4){animation-delay:1.8s!important}
/* Logos de empresas (ficticias) */
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:13px;line-height:1.15;min-width:0}
.logo .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--c)}
.logo .mk svg{width:20px;height:20px}
.logo.lg .mk{width:46px;height:46px;border-radius:13px}.logo.lg .mk svg{width:26px;height:26px}
.logo.lg{font-size:15px}
.logo .nm small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted)}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:34px;width:max-content;padding-block:4px}
@media (prefers-reduced-motion:no-preference){.track{animation:marquee 30s linear infinite}}

/* Ofertas */
.jobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.jobs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.jobs{grid-template-columns:minmax(0,1fr)}}
.job{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.job .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.job h3{font-size:14.5px;font-weight:700;flex:1}
.job .meta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.job .meta span{display:flex;align-items:center;gap:6px}
.job .meta svg{width:13px;height:13px;flex:none}
.bm{border:0;background:none;padding:4px;color:var(--muted)}
.bm.on{color:var(--sun)}
.bm svg{width:18px;height:18px}
.matchbar{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--brand-700)}
.matchbar .t{flex:1;height:6px;border-radius:99px;background:var(--mint-100);overflow:hidden}
.matchbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#58D9BE);border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag svg{width:12px;height:12px}
.t-ok{background:var(--good-soft);color:var(--good)}.t-in{background:var(--sky-soft);color:var(--sky)}.t-wa{background:var(--sun-soft);color:#A56A00}.t-no{background:var(--coral-soft);color:#C23B29}.t-br{background:var(--mint-100);color:var(--brand-700)}.t-vi{background:var(--violet-soft);color:var(--violet)}

/* Tarjetas de funciones */
.feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feats{grid-template-columns:minmax(0,1fr)}}
.feat{background:var(--mint-50);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.feat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--brand-700);box-shadow:var(--shadow)}
.feat .ic svg{width:20px;height:20px}
.feat h3{font-size:14.5px;font-weight:700}
.feat p{margin:0;font-size:12.5px;color:var(--muted);flex:1}
.feat .btn{align-self:flex-start}
.feat.v .ic{color:var(--violet)}.feat.s .ic{color:#C98200}.feat.k .ic{color:var(--sky)}

/* Ruta */
.route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:760px){.route{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border-radius:14px;padding:12px;background:#fff;border:1px solid var(--line);position:relative;min-width:0}
.stage.done{background:var(--mint-50)}
.stage.now{background:linear-gradient(150deg,var(--brand),var(--brand-700));color:#fff;border-color:transparent;box-shadow:0 12px 24px -12px var(--brand-700)}
.stage .cy{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.stage .h{font-family:var(--display);font-weight:700;font-size:13.5px;margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;overflow-wrap:anywhere}
.stage ul{margin:6px 0 0;padding-left:15px;font-size:11.5px;opacity:.85}
.stage .ck{width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.stage .ck svg{width:11px;height:11px}
.stage .you{position:absolute;top:-10px;right:10px;background:var(--sun);color:var(--ink);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px}

/* Barras */
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:9px;border-radius:99px;background:var(--mint-100);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#5CDDC2);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.bar .tr i.lo{background:linear-gradient(90deg,var(--sun),#FFCE6B)}
.bar .v{font-family:var(--mono);font-size:12px;text-align:right}
@media (max-width:420px){.bar{grid-template-columns:100px minmax(0,1fr) 30px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600}
.chip i{font-style:normal;font-size:11px;font-weight:700;color:var(--brand-700);background:var(--mint-100);padding:1px 7px;border-radius:99px}

/* Columna derecha */
.ringcard{text-align:center}
.ring{position:relative;width:128px;height:128px;margin:6px auto 8px}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:var(--mint-100)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-family:var(--display);font-size:28px;line-height:1}
.ring .val small{font-size:11px;color:var(--muted);font-weight:600}
.score{display:flex;align-items:center;gap:12px}
.star{width:44px;height:44px;border-radius:14px;background:var(--sun-soft);display:grid;place-items:center;color:var(--sun);flex:none}
.star svg{width:24px;height:24px}
.score b{font-family:var(--display);font-size:24px;display:block;line-height:1.1}
.top20{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--mint-50);border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:600}
.top20 svg{width:16px;height:16px;color:#C98200;flex:none}
.pf{display:flex;gap:12px;align-items:center}
.pf .av{width:54px;height:54px;font-size:18px}
.pf b{font-family:var(--display);font-size:15px;display:block;line-height:1.2}

/* Asistente IA */
.ai-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bot{width:36px;height:36px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.bot svg{width:20px;height:20px}
.online{display:inline-flex;align-items:center;gap:5px}.online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;margin-bottom:10px}
.msg{font-size:12.5px;padding:9px 11px;border-radius:14px;max-width:92%}
.msg.b{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.msg.u{background:var(--brand-700);color:#fff;align-self:flex-end;border-top-right-radius:4px}
@media (prefers-reduced-motion:no-preference){.msg{animation:pop .35s ease both}}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopts button{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;transition:border-color .2s,background .2s}
.qopts button:hover{border-color:var(--brand);background:var(--mint-50)}
.qopts svg{width:15px;height:15px;color:var(--brand-700);flex:none}
.typing{display:inline-flex;gap:3px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--brand-700);opacity:.5}
@media (prefers-reduced-motion:no-preference){.typing i{animation:floaty .9s ease-in-out infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}}
.quote{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--mint-100),var(--mint-50));border-radius:var(--r);padding:16px;font-family:var(--display);font-weight:700;font-size:14px}
.quote svg{width:34px;height:34px;color:var(--brand-700);flex:none}

/* Listas y tablas */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .t{font-weight:700}
.item .m{font-size:12.5px;color:var(--muted)}
.grow{flex:1 1 200px;min-width:0}
.fb{flex-basis:100%;background:var(--mint-50);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:8px 10px;font-size:12.5px}
.fb.n{border-color:var(--coral);background:#FFF7F5}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{min-width:200px}
td:last-child select{min-width:150px}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--mint-50)}
.person{display:flex;align-items:center;gap:10px}
.person .av{width:34px;height:34px;font-size:12px}
.sc{font-family:var(--mono);font-weight:700;font-size:14px}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border-radius:var(--r);padding:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--mint-100);color:var(--brand-700)}
.kpi .ic svg{width:18px;height:18px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600;padding-right:40px}
.kpi strong{display:block;font-family:var(--display);font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;font-weight:700;color:var(--good)}
.kpi em.dn{color:var(--coral)}
.kpi.hl{background:linear-gradient(140deg,var(--brand),var(--brand-700));color:#fff;border-color:transparent}
.kpi.hl span,.kpi.hl em{color:rgba(255,255,255,.88)}
.kpi.hl .ic{background:rgba(255,255,255,.18);color:#fff}

.pagehead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,var(--mint-100),var(--mint-50) 60%);border:1px solid var(--line);border-radius:22px;padding:22px 24px}
.pagehead h1{font-size:clamp(22px,2.6vw,30px);font-weight:800;margin-top:12px}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.seal{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(120deg,var(--good-soft),#F0FBF6)}
.seal .badge{width:54px;height:54px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none;box-shadow:0 0 0 5px rgba(22,160,106,.18)}
.minichart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:22px}
.minichart div{flex:1;border-radius:8px 8px 0 0;background:var(--mint-200);transform-origin:bottom;position:relative;min-width:0}
.minichart div.hl{background:linear-gradient(180deg,#5CDDC2,var(--brand))}
.minichart div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.minichart div{animation:grow .8s cubic-bezier(.2,.7,.2,1) both}}
.mlabels{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}.mlabels span{flex:1;text-align:center}

/* Modal de juego */
.modal{position:fixed;inset:0;z-index:40;background:rgba(16,48,42,.45);display:grid;place-items:center;padding:16px}
.dialog{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.dialog{animation:pop .35s ease both}}
.dialog h3{font-size:18px;font-weight:700;margin:10px 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opts button{text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;transition:border-color .2s,background .2s}
.opts button:hover:not(:disabled){border-color:var(--brand)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--good);background:var(--good-soft)}
.opts button.wrong{border-color:var(--coral);background:var(--coral-soft)}
.timer{height:6px;border-radius:99px;background:var(--mint-100);overflow:hidden}
.timer i{display:block;height:100%;background:var(--violet);width:100%}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;font-size:13.5px;z-index:50;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast svg{width:16px;height:16px;color:#5CDDC2;flex:none}
.foot{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:0 28px;font-size:12px;color:var(--muted);text-align:center}

/* ---------- Animaciones al mostrar ---------- */
const fmtN=(n,suf)=>String(n).replace(/\B(?=(\d{3})+$)/g,' ')+(suf||'');
function settle(){
 $$('[data-w]',app).forEach(el=>el.style.width=el.dataset.w+'%');
 $$('[data-ring]',app).forEach(el=>el.style.strokeDashoffset=327*(1-el.dataset.ring/100));
}
function animate(){
 $$('[data-count]',app).forEach(el=>el.textContent=fmtN(0,el.dataset.suf));
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  settle();
  $$('[data-count]',app).forEach(el=>{
   const to=+el.dataset.count,suf=el.dataset.suf;
   if(RM){el.textContent=fmtN(to,suf);return}
   const t0=performance.now(),d=1100;
   const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmtN(Math.round(to*e),suf);if(k<1)requestAnimationFrame(step)};
   requestAnimationFrame(step);
  });
 }));
}
function rerender(){
 const y=window.scrollY, msgs=$('#msgs')?.innerHTML;
 app.classList.remove('view');
 app.innerHTML=V[cur]();
 $$('[data-count]',app).forEach(el=>el.textContent=fmtN(+el.dataset.count,el.dataset.suf));
 $$('[data-w],[data-ring]',app).forEach(el=>el.style.transition='none');settle();
 if(msgs&&$('#msgs'))$('#msgs').innerHTML=msgs;
 window.scrollTo(0,y);
}

 if(!V[v])v='estudiante';cur=v;
 $$('.roles button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
 $('#nav').innerHTML=NAV[v].map(([i,t],n)=>`<a href="#${v}" class="${n===0?'on':''}" data-nav>${ic(i)}<span>${t}</span></a>`).join('');
 app.classList.remove('view');void app.offsetWidth;app.classList.add('view');
 app.innerHTML=V[v]();animate();
 if(!keepScroll)window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
 try{localStorage.setItem('enmatch-rol',v)}catch(e){}
}
$('.roles').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;stopPresent();show(b.dataset.v)});
$('#nav').addEventListener('click',e=>{const a=e.target.closest('[data-nav]');if(!a)return;e.preventDefault();$$('#nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');toast(a.textContent.trim()+': sección de ejemplo del prototipo')});

function toast(msg){const t=$('#toast');t.innerHTML=ic('check',3)+'<span></span>';t.lastChild.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

/* ---------- Asistente IA (respuestas de ejemplo) ---------- */
const AI={
 cv:['Optimizar mi CV','Tu CV es fuerte en proyectos. Te sugiero: 1) abrir con tu logro en Santander X (de 3 a 15 participantes), 2) poner la cifra de VPN y TIR de tu modelo @RISK para Fama, y 3) subir Power BI: 7 de cada 10 prácticas que te interesan lo piden.'],
 ent:['Prepararme para una entrevista','Tienes entrevista con Ruta Norte el jueves. Practiquemos: “Cuéntame de un proyecto donde tomaste decisiones con incertidumbre”. Consejo: usa tu simulación Monte Carlo y explica qué variable movía más el VPN.'],
 deb:['Ver mis puntos débiles','Tu punto más bajo es inglés (46/100): te descartó en 1 de 3 postulaciones. Luego, FlexSim y @RISK siguen “en desarrollo”; un reto práctico los convierte en insignias verificadas.'],
 cur:['Recomendarme cursos','Para tu perfil: “Inglés para entrevistas” de Aprende+ Perú (6 h, +80 pts) y “Power BI desde cero” (+60 pts). Con los dos subes al nivel “Listo para practicar”.']
};
function askAI(k){
 const box=$('#msgs');if(!box)return;
 const [q,a]=AI[k];
 const u=document.createElement('div');u.className='msg u';u.textContent=q;box.appendChild(u);
 const b=document.createElement('div');b.className='msg b';b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';box.appendChild(b);
 box.scrollTop=box.scrollHeight;
 $('#aicard').scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});
 setTimeout(()=>{b.textContent=a;box.scrollTop=box.scrollHeight},RM?0:900);
}

/* ---------- Juego ---------- */
const Q={q:'Coordinas una línea de producción. ¿Cuál de estos NO es un elemento del costo de producción?',o:['Materiales directos','Mano de obra directa','Costos indirectos de fabricación','Gastos de publicidad'],c:3};
function closeGame(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function openGame(){
 const m=$('#modal');
 m.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="gq"><span class="tag t-vi">${ic('game')} Reto de costos · +20 pts</span><h3 id="gq">${Q.q}</h3><div class="timer"><i id="tm"></i></div><div class="opts">${Q.o.map((o,i)=>`<button data-opt="${i}">${o}</button>`).join('')}</div><p class="small muted" id="gres" style="margin:0 0 12px">Elige una respuesta antes de que termine el tiempo.</p><div style="display:flex;justify-content:flex-end"><button class="btn" data-close>Cerrar</button></div></div>`;
 m.hidden=false;
 const tm=$('#tm');if(!RM){tm.style.transition='width 20s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>tm.style.width='0%'))}
 $('[data-opt]',m).focus();
}
$('#modal').addEventListener('click',e=>{
 const m=$('#modal');
 if(e.target===m||e.target.closest('[data-close]'))return closeGame();
 const b=e.target.closest('[data-opt]');if(!b||b.disabled)return;
 const i=+b.dataset.opt;
 $$('[data-opt]',m).forEach((x,j)=>{x.disabled=true;if(j===Q.c)x.classList.add('right');else if(j===i)x.classList.add('wrong')});
 const tm=$('#tm');const w=getComputedStyle(tm).width;tm.style.transition='none';tm.style.width=w;
 if(i===Q.c){
  ME.pts+=20;
  $('#gres').innerHTML='<b style="color:var(--good)">¡Correcto! +20 puntos.</b> La publicidad es un gasto de venta, no de producción.';
  toast('Ganaste 20 puntos. Total: '+fmtN(ME.pts,' pts'));
  const p=$('#pts');if(p){p.dataset.count=ME.pts;p.textContent=fmtN(ME.pts,' pts')}
 } else $('#gres').innerHTML='<b style="color:var(--coral)">Casi.</b> Los tres elementos del costo son materiales, mano de obra y CIF; la publicidad es un gasto de venta.';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeGame()});

/* ---------- Acciones ---------- */
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if('game' in d)return openGame();
 if(d.ai)return askAI(d.ai);
 if(d.toast)return toast(d.toast);
 if(d.go){const el=$('#'+d.go);el&&el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});return}
 if(d.bm){const o=S.ofertas.find(x=>x.id==d.bm);o.bm=!o.bm;rerender();return toast(o.bm?'Guardaste la oferta':'Quitaste la oferta de guardados')}
 if(d.post){const o=S.ofertas.find(x=>x.id==d.post);o.est=1;rerender();return toast('Postulaste a '+o.t)}
 if(d.inv){S.cand[d.inv].st='inv';rerender();return toast('Invitación enviada a '+S.cand[d.inv].n)}
 if(d.val){S.vol[d.val].st='ok';rerender();return toast('Insignia emitida a '+S.vol[d.val].n)}
 if(d.apr){S.pend[d.apr].st='ok';rerender();return toast(L[S.pend[d.apr].k].n+' aprobada')}
 if(d.rec){S.pend[d.rec].st='no';rerender();return toast(L[S.pend[d.rec].k].n+' rechazada')}
});
app.addEventListener('change',e=>{const s=e.target;if(!s.id||!s.id.startsWith('mot-')||!s.value)return;const i=+s.id.slice(4);const m=s.value;S.cand[i].st='des';rerender();toast('Respuesta enviada a '+S.cand[i].n+': '+m)});
app.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'&&e.target.value.trim())toast('Buscando “'+e.target.value.trim()+'”')});

/* ---------- Modo presentación ---------- */
let pres=null;const PDUR=9000;
function tickBar(){const pb=$('#pbar');pb.style.transition='none';pb.style.width='0';void pb.offsetWidth;if(!RM){pb.style.transition=`width ${PDUR}ms linear`;pb.style.width='100%'}}
function stopPresent(){if(!pres)return;clearInterval(pres);pres=null;const b=$('#present');b.classList.remove('on');b.setAttribute('aria-pressed','false');b.lastChild.textContent='Presentar';const pb=$('#pbar');pb.style.transition='none';pb.style.width='0'}
$('#present').addEventListener('click',()=>{
 if(pres)return stopPresent();
 const b=$('#present');b.classList.add('on');b.setAttribute('aria-pressed','true');b.lastChild.textContent='Detener';
 show(cur);tickBar();
 pres=setInterval(()=>{show(ORDER[(ORDER.indexOf(cur)+1)%ORDER.length]);tickBar()},PDUR);
});

/* ---------- Inicio ---------- */
let start='estudiante';const h=(location.hash||'').slice(1);
if(ORDER.includes(h))start=h;else{try{const s=localStorage.getItem('enmatch-rol');if(ORDER.includes(s))start=s}catch(e){}}
show(start,true);
</script>
